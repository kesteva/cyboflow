name: Windows installer

# Reusable job: package (and, with the AZURE_* secrets, sign) one NSIS
# installer on a Windows runner. Called from two places, so the body lives
# once:
#   - windows.yml     → manual dispatch and the path-filtered branch-push smoke
#   - dev-release.yml → the continuous dev build on every push to main
#
# `pnpm build:win` is the only check that exercises the afterSign Windows arm
# against real v13 prebuilds. Signing runs here rather than on a Mac because
# app-builder-lib drives Azure Artifact Signing through PowerShell.

on:
  workflow_call:
    inputs:
      variant:
        description: 'stable (Cyboflow) or dev (Cyboflow Dev, polls the /dev feed)'
        type: string
        default: stable
      build_version:
        description: 'CYBOFLOW_BUILD_VERSION override (e.g. 0.4.3-dev.12); empty = package.json'
        type: string
        default: ''
      ref:
        description: 'Git ref to build; empty = the ref that triggered the caller'
        type: string
        default: ''
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      SENTRY_DSN:
        required: false
      APTABASE_APP_KEY:
        required: false
  workflow_dispatch:
    inputs:
      variant:
        description: 'App variant to package: stable (Cyboflow) or dev (Cyboflow Dev, polls the /dev feed)'
        type: choice
        options: [stable, dev]
        default: stable
      build_version:
        description: 'CYBOFLOW_BUILD_VERSION override (e.g. 0.4.3-dev.12); empty = package.json'
        type: string
        default: ''

jobs:
  installer:
    name: Installer (pnpm build:win${{ inputs.variant == 'dev' && ':dev' || '' }})
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # `inputs.variant` is empty on a bare call → stable.
      WIN_VARIANT: ${{ inputs.variant == 'dev' && 'dev' || 'stable' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # ensure-sqlite-abi electron (no-op on the v13 prebuild, but it also
      # triggers Electron's first-use binary download) → build:frontend →
      # build:main → inject-build-info → configure-build --platform win
      # (lean packaging plan, Electron-ABI preflight) → electron-builder NSIS
      # → afterSign Windows arm (PE machine check, packaged better-sqlite3
      # load probe under the packaged Electron, win-unpacked size floor).
      # electron-builder downloads its NSIS/winCodeSign tooling on first use;
      # the runner is an administrator, so the winCodeSign archive's darwin
      # symlinks extract (see docs/WINDOWS-BUILD.md → Troubleshooting).
      #
      # SIGNING: the AZURE_* vars below are the Microsoft Entra ID credentials
      # electron-builder reads for Azure Artifact Signing. configure-build.js
      # injects win.azureSignOptions only when all of them are populated, so a
      # run WITHOUT the secrets (a fork PR, or a repo where they were never
      # configured) still produces a valid — if unsigned — installer rather
      # than failing. Half-populated is the one case that hard-fails, by
      # design: a release that silently ships unsigned is worse than a red
      # build. See docs/WINDOWS-BUILD.md → "Code signing (Azure Artifact Signing)".
      #
      # VARIANT: build:win:dev packages "Cyboflow Dev" (separate appId, artifact
      # name, and the /dev update feed) — the Windows twin of build:mac:dev.
      #
      # TELEMETRY: SENTRY_DSN / APTABASE_APP_KEY are BAKED into buildInfo.json
      # by inject-build-info.js; a build without them ships with both SDKs
      # silently no-op'd (the 0.4.0–0.4.2 Windows installers did exactly that).
      - name: Build Windows installer
        run: pnpm build:win${{ env.WIN_VARIANT == 'dev' && ':dev' || '' }}
        env:
          CI: true
          # build:win:dev passes --variant to configure-build.js but cannot
          # export BUILD_VARIANT for inject-build-info the way build:mac:dev
          # does (no `VAR=x cmd` on cmd.exe), so the About dialog / telemetry
          # environment would otherwise stamp a dev installer "stable".
          BUILD_VARIANT: ${{ env.WIN_VARIANT }}
          CYBOFLOW_BUILD_ENV: ${{ env.WIN_VARIANT }}
          CYBOFLOW_BUILD_VERSION: ${{ inputs.build_version }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
        timeout-minutes: 40

      # Artifact name carries the variant so a stable and a dev run on the same
      # ref never overwrite each other; the stable name is unchanged for the
      # release runbook and any older link.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cyboflow-windows-x64-installer${{ env.WIN_VARIANT == 'dev' && '-dev' || '' }}
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/*.yml
          if-no-files-found: error
          retention-days: 7
