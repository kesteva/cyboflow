name: Windows

# Windows parity runs, dispatch-only while they build a track record. Nothing
# else in CI runs on a Windows host: quality.yml is ubuntu, e2e.yml is macOS.
# Every `skipIf(process.platform !== 'win32')` test (afterSign cases Y–AA,
# the named-pipe orch socket, the PowerShell process table, taskkill, the
# cmd.exe quoting probes) executes ONLY here, and `pnpm build:win` is the only
# check that exercises the afterSign Windows arm against real v13 prebuilds.
# Promote the unit job into branch protection once it has run green a few
# times; the installer job stays a smoke (artifact only — signed when the
# AZURE_* secrets are configured, unsigned otherwise).

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Also package the NSIS installer (pnpm build:win)'
        type: boolean
        default: true
  # workflow_dispatch only resolves files on the default branch, so a branch
  # that edits this file runs it on push — the only way to exercise a change
  # here before it reaches main. The other paths are the install/packaging
  # surfaces these jobs exist to guard (.gitattributes decides what a Windows
  # checkout even contains — see its header); a source-only push does not spin up
  # two Windows runners. Both jobs run on this path.
  push:
    branches-ignore: [ main ]
    paths:
      - '.github/workflows/windows.yml'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'main/package.json'
      - 'build/**'
      - 'scripts/configure-build.js'
      - 'scripts/apply-pty-napi-prebuilds.js'
      - 'scripts/ensure-sqlite-abi.mjs'
      - 'scripts/rebuild-better-sqlite3-host.mjs'
      # The win32-gated process-tree suites and the modules they drive execute
      # on no other runner, so a change to them has to run here to be tested
      # at all.
      - 'main/src/__test_fixtures__/processTree.ts'
      - 'main/src/utils/platformProcess.ts'
      - 'main/src/services/processTable.ts'
      - 'main/src/services/winProcessTable.ts'
      - 'main/src/**/*.win32.test.ts'
      - 'main/src/services/__tests__/runCommandManager.winProcessOps.test.ts'
      - 'main/src/services/panels/cli/__tests__/abstractCliManager.pty.test.ts'

jobs:
  unit:
    name: Unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: 'pnpm'

      # Root postinstall = apply-pty-napi-prebuilds.js (places node-pty's
      # N-API alias so electron-rebuild skips node-gyp) + electron-builder
      # install-app-deps. Both native modules are prebuilt; no MSVC involved.
      - name: Install dependencies
        run: pnpm install

      # Same step as the ubuntu `test` job. better-sqlite3 v13 has no install
      # script, so the rebuild is a no-op; the value is the :memory: load probe
      # that proves prebuilds/win32-x64.node opens under host Node before the
      # DB suites depend on it.
      - name: Rebuild better-sqlite3 for host Node ABI
        run: node scripts/rebuild-better-sqlite3-host.mjs

      # The cyboflowMcpServer subprocess tests spawn the BUILT bundle and
      # hard-fail under CI=true when it is absent (see quality.yml).
      - name: Build main (MCP server bundle for subprocess tests)
        run: pnpm build:main

      # Headless unit chain: main + frontend vitest, schema parity, release
      # scripts, ABI + build tests. Windows runners are roughly 2× slower than
      # the ubuntu job's ~10-minute vitest legs, hence the larger ceiling.
      - name: Run unit tests
        run: pnpm test:unit
        env:
          CI: true
        timeout-minutes: 60

  installer:
    name: Installer (pnpm build:win)
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || inputs.build_installer }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # ensure-sqlite-abi electron (no-op on the v13 prebuild, but it also
      # triggers Electron's first-use binary download) → build:frontend →
      # build:main → inject-build-info → configure-build --platform win
      # (lean packaging plan, Electron-ABI preflight) → electron-builder NSIS
      # → afterSign Windows arm (PE machine check, packaged better-sqlite3
      # load probe under the packaged Electron, win-unpacked size floor).
      # electron-builder downloads its NSIS/winCodeSign tooling on first use;
      # the runner is an administrator, so the winCodeSign archive's darwin
      # symlinks extract (see docs/WINDOWS-BUILD.md → Troubleshooting).
      #
      # SIGNING: the AZURE_* vars below are the Microsoft Entra ID credentials
      # electron-builder reads for Azure Artifact Signing. configure-build.js
      # injects win.azureSignOptions only when all of them are populated, so a
      # run WITHOUT the secrets (a fork PR, or a repo where they were never
      # configured) still produces a valid — if unsigned — installer rather
      # than failing. Half-populated is the one case that hard-fails, by
      # design: a release that silently ships unsigned is worse than a red
      # build. Signing runs here rather than on a Mac because app-builder-lib
      # drives it through PowerShell and would otherwise need a Windows VM.
      # See docs/WINDOWS-BUILD.md → "Code signing (Azure Artifact Signing)".
      - name: Build Windows installer
        run: pnpm build:win
        env:
          CI: true
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        timeout-minutes: 40

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cyboflow-windows-x64-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/*.yml
          if-no-files-found: error
          retention-days: 7
