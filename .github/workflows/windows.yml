name: Windows

# Windows parity runs. Nothing else in CI runs on a Windows host: quality.yml
# is ubuntu, e2e.yml is macOS. The unit job body lives in windows-unit.yml (a
# reusable workflow) because it is ALSO part of the main gate — quality.yml
# calls it on every PR and every push to main. This file is the branch-push /
# manual-dispatch surface for the same job plus the installer, which stays a
# smoke (artifact only — signed when the AZURE_* secrets are configured,
# unsigned otherwise) and is the only check that exercises the afterSign
# Windows arm against real v13 prebuilds.

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Also package the NSIS installer (pnpm build:win)'
        type: boolean
        default: true
      variant:
        description: 'App variant to package: stable (Cyboflow) or dev (Cyboflow Dev, polls the /dev feed)'
        type: choice
        options: [stable, dev]
        default: stable
  # workflow_dispatch only resolves files on the default branch, so a branch
  # that edits this file runs it on push — the only way to exercise a change
  # here before it reaches main. The other paths are the install/packaging
  # surfaces these jobs exist to guard (.gitattributes decides what a Windows
  # checkout even contains — see its header); a source-only push does not spin up
  # two Windows runners. Both jobs run on this path.
  push:
    branches-ignore: [ main ]
    paths:
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-unit.yml'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'main/package.json'
      - 'build/**'
      - 'scripts/configure-build.js'
      - 'scripts/apply-pty-napi-prebuilds.js'
      - 'scripts/ensure-sqlite-abi.mjs'
      - 'scripts/rebuild-better-sqlite3-host.mjs'
      # The win32-gated process-tree suites and the modules they drive execute
      # on no other runner, so a change to them has to run here to be tested
      # at all.
      - 'main/src/__test_fixtures__/processTree.ts'
      - 'main/src/utils/platformProcess.ts'
      - 'main/src/services/processTable.ts'
      - 'main/src/services/winProcessTable.ts'
      - 'main/src/**/*.win32.test.ts'
      - 'main/src/services/__tests__/runCommandManager.winProcessOps.test.ts'
      - 'main/src/services/panels/cli/__tests__/abstractCliManager.pty.test.ts'

jobs:
  unit:
    name: Unit tests (Windows)
    uses: ./.github/workflows/windows-unit.yml

  installer:
    name: Installer (pnpm build:win${{ inputs.variant == 'dev' && ':dev' || '' }})
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || inputs.build_installer }}
    timeout-minutes: 45
    env:
      # `inputs.variant` is empty on a push run → stable.
      WIN_VARIANT: ${{ inputs.variant == 'dev' && 'dev' || 'stable' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # ensure-sqlite-abi electron (no-op on the v13 prebuild, but it also
      # triggers Electron's first-use binary download) → build:frontend →
      # build:main → inject-build-info → configure-build --platform win
      # (lean packaging plan, Electron-ABI preflight) → electron-builder NSIS
      # → afterSign Windows arm (PE machine check, packaged better-sqlite3
      # load probe under the packaged Electron, win-unpacked size floor).
      # electron-builder downloads its NSIS/winCodeSign tooling on first use;
      # the runner is an administrator, so the winCodeSign archive's darwin
      # symlinks extract (see docs/WINDOWS-BUILD.md → Troubleshooting).
      #
      # SIGNING: the AZURE_* vars below are the Microsoft Entra ID credentials
      # electron-builder reads for Azure Artifact Signing. configure-build.js
      # injects win.azureSignOptions only when all of them are populated, so a
      # run WITHOUT the secrets (a fork PR, or a repo where they were never
      # configured) still produces a valid — if unsigned — installer rather
      # than failing. Half-populated is the one case that hard-fails, by
      # design: a release that silently ships unsigned is worse than a red
      # build. Signing runs here rather than on a Mac because app-builder-lib
      # drives it through PowerShell and would otherwise need a Windows VM.
      # See docs/WINDOWS-BUILD.md → "Code signing (Azure Artifact Signing)".
      #
      # VARIANT: build:win:dev packages "Cyboflow Dev" (separate appId, artifact
      # name, and the /dev update feed) — the Windows twin of build:mac:dev. A
      # release publishes both; docs/RELEASE-RUNBOOK.md dispatches this workflow
      # once per variant.
      - name: Build Windows installer
        run: pnpm build:win${{ env.WIN_VARIANT == 'dev' && ':dev' || '' }}
        env:
          CI: true
          # build:win:dev passes --variant to configure-build.js but cannot
          # export BUILD_VARIANT for inject-build-info the way build:mac:dev
          # does (no `VAR=x cmd` on cmd.exe), so the About dialog / telemetry
          # environment would otherwise stamp a dev installer "stable".
          BUILD_VARIANT: ${{ env.WIN_VARIANT }}
          CYBOFLOW_BUILD_ENV: ${{ env.WIN_VARIANT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        timeout-minutes: 40

      # Artifact name carries the variant so a stable and a dev run on the same
      # ref never overwrite each other; the stable name is unchanged for the
      # release runbook and any older link.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cyboflow-windows-x64-installer${{ env.WIN_VARIANT == 'dev' && '-dev' || '' }}
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/*.yml
          if-no-files-found: error
          retention-days: 7
