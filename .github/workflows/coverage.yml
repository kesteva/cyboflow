name: Coverage (nightly)

# Report-only coverage — no threshold yet (see
# docs/archive/test-coverage-tightening-plan.md Workstream C). This re-runs the
# main and frontend vitest suites with V8 instrumentation on and tails the
# text-reporter table into the job summary; nothing reads the number, it exists
# to make coverage visible while a baseline is established.
#
# It used to be a job inside Code Quality (quality.yml). Being report-only it
# gated nothing there either, but dev-release.yml and stable-release.yml fire on
# `workflow_run` when Code Quality CONCLUDES, and a workflow does not conclude
# until every job has — so a 13-minute readout was delaying every release by 13
# minutes. A coverage figure is a trend, not a per-commit fact, so it now runs
# nightly on main alongside the E2E tier (e2e.yml), and on demand.
#
# The text-reporter table (main/frontend vitest.config.ts both list 'text'
# first) is captured to a log file and tailed into the job summary rather than
# parsing a coverage-summary.json the 'text'/'json'/'html' reporter set doesn't
# produce.

on:
  workflow_dispatch:
  schedule:
    # 07:30 UTC nightly — after the 07:00 E2E tier.
    - cron: '30 7 * * *'

jobs:
  coverage:
    name: Coverage (report-only)
    runs-on: ubuntu-latest
    # A coverage-run hiccup never reds the workflow.
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.15.1'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    # Coverage runs main DB tests under host Node, so the same ABI flip the
    # Code Quality `test` job needs applies.
    - name: Rebuild better-sqlite3 for host Node ABI
      run: node scripts/rebuild-better-sqlite3-host.mjs

    - name: Coverage (report-only, main)
      if: always()
      continue-on-error: true
      run: pnpm --filter main exec vitest run --coverage --reporter=dot | tee main-coverage.log
      env:
        CI: true
      timeout-minutes: 10

    - name: Coverage summary (main)
      if: always()
      continue-on-error: true
      run: |
        {
          echo "### Main coverage (report-only)"
          echo '```'
          head -n 60 main-coverage.log 2>/dev/null || echo "(no coverage output captured)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Coverage (report-only, frontend)
      if: always()
      continue-on-error: true
      run: pnpm --filter frontend exec vitest run --coverage --reporter=dot | tee frontend-coverage.log
      env:
        CI: true
      timeout-minutes: 10

    - name: Coverage summary (frontend)
      if: always()
      continue-on-error: true
      run: |
        {
          echo "### Frontend coverage (report-only)"
          echo '```'
          head -n 60 frontend-coverage.log 2>/dev/null || echo "(no coverage output captured)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
