name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  DCO:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Verify Signed-off-by on every commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const failures = [];
            let botExempt = 0;
            for (const c of commits) {
              const sha = c.sha.substring(0, 7);
              // Merge commits (2+ parents) are not authored work — skip them.
              if (c.parents && c.parents.length > 1) continue;

              // Commits made by Claude's cloud sessions (e.g. Sentry auto-fix PRs)
              // are exempt: a sign-off is a human's certification, which the bot
              // cannot give, and the maintainer reviews every such PR before merge.
              // All three must hold, so setting the author email alone is not
              // enough: GitHub links the commit to the `claude` account, the
              // author email is Anthropic's noreply address, and GitHub reports
              // the commit's signature as verified.
              const authorLogin = (c.author && c.author.login) || '';
              const authorEmail = ((c.commit.author && c.commit.author.email) || '').trim().toLowerCase();
              const verified = Boolean(c.commit.verification && c.commit.verification.verified);
              if (authorLogin === 'claude' && authorEmail === 'noreply@anthropic.com' && verified) {
                core.info(`${sha}: authored by the Claude bot (verified); sign-off not required`);
                botExempt++;
                continue;
              }

              const message = c.commit.message || '';
              const matches = [...message.matchAll(/^Signed-off-by: (.+) <(.+)>$/gim)];
              if (matches.length === 0) {
                failures.push(`${sha}: missing "Signed-off-by" trailer`);
                continue;
              }

              const author = c.commit.author || {};
              const name = (author.name || '').trim().toLowerCase();
              const email = (author.email || '').trim().toLowerCase();
              const ok = matches.some(
                (m) => m[1].trim().toLowerCase() === name && m[2].trim().toLowerCase() === email
              );
              if (!ok) {
                failures.push(
                  `${sha}: "Signed-off-by" does not match author ${author.name} <${author.email}>`
                );
              }
            }

            if (failures.length) {
              core.setFailed(
                'DCO check failed — every commit must carry a "Signed-off-by" trailer matching its ' +
                  'author (commit with `git commit -s`). See CONTRIBUTING.md and the DCO file.\n\n' +
                  failures.join('\n')
              );
            } else {
              core.info(
                botExempt
                  ? `DCO: all ${commits.length} commit(s) pass (${botExempt} exempt as Claude bot commits).`
                  : `DCO: all ${commits.length} commit(s) signed off.`
              );
            }
