name: macOS

# Hosted macOS builds — the off-device twin of windows.yml. Dispatch-only while
# it earns a track record against the local `pnpm build:mac:*` recipe in
# docs/RELEASE-RUNBOOK.md §3; the plan is for a push-to-main dev release and a
# tag-driven stable release to call this same job once its DMGs match.
#
# One NATIVE runner per arch (macos-latest = arm64, macos-15-intel = x64): every
# build is a clean checkout on a host whose arch IS the target arch, so the
# whole cross-arch landmine class in the runbook (foreign pty.node, the
# darwin-cross install, "freeze the tree", the 215K stub DMG) does not apply.
# If GitHub retires the Intel label, the fallback is the runbook's cross-arch
# path on the arm64 runner (`pnpm run install:darwin-cross` + BUILD_ARCH=x64).
#
# SIGNING: five GitHub secrets, the same names `.envrc.local` uses locally —
#   CSC_LINK (base64 of the Developer ID .p12), CSC_KEY_PASSWORD,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD.
# configure-build.js derives the posture from their presence: none → an
# unsigned, un-notarized build (still a valid smoke of the packaging); all
# five → signed + hardened + notarized + stapled, exactly the release posture.
# Half-populated hard-fails in the preflight below, by design — a build that
# silently ships signed-but-not-notarized is worse than a red one.
# electron-builder imports CSC_LINK into a throwaway keychain on CI hosts, so
# no keychain setup step is needed.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'App variant: dev (Cyboflow Dev, polls the /dev feed) or stable (Cyboflow)'
        type: choice
        options: [dev, stable]
        default: dev
      arch:
        description: 'Which DMGs to build'
        type: choice
        options: [both, arm64, x64]
        default: both
  # workflow_dispatch only resolves files on the default branch, so a branch
  # that edits this file runs it on push (dev variant, both arches) — the only
  # way to exercise a change here before it reaches main.
  push:
    branches-ignore: [ main ]
    paths:
      - '.github/workflows/macos.yml'

jobs:
  build:
    name: DMG (${{ matrix.arch }}, ${{ inputs.variant || 'dev' }})
    strategy:
      fail-fast: false
      matrix:
        # `inputs.arch` is empty on a push run → both. (A job-level `if` cannot
        # see the matrix context, and an `include` row whose arch is not in the
        # matrix would be ADDED as a new combination — so the filter lives here.)
        arch: ${{ fromJSON(inputs.arch == 'arm64' && '["arm64"]' || inputs.arch == 'x64' && '["x64"]' || '["arm64","x64"]') }}
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-latest' }}
    timeout-minutes: 60
    env:
      # `inputs.variant` is empty on a push run → dev.
      MAC_VARIANT: ${{ inputs.variant == 'stable' && 'stable' || 'dev' }}
      APP_NAME: ${{ inputs.variant == 'stable' && 'Cyboflow' || 'Cyboflow Dev' }}
      # electron-builder's per-arch staging dir: arm64 → mac-arm64/, x64 → mac/.
      STAGING: ${{ matrix.arch == 'x64' && 'mac' || 'mac-arm64' }}
      LIPO_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # All-or-nothing on the Apple secrets (see the header). Sets SIGNED for
      # the verify step so the notarization checks only run when they can pass.
      - name: Signing preflight
        run: |
          set=0; for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -n "${!v}" ]; then set=$((set+1)); fi
          done
          if [ "$set" -eq 5 ]; then echo "SIGNED=1" >> "$GITHUB_ENV"; echo "Apple secrets: all 5 present → signed + notarized build"
          elif [ "$set" -eq 0 ]; then echo "SIGNED=0" >> "$GITHUB_ENV"; echo "Apple secrets: none → unsigned build"
          else echo "::error::$set of 5 Apple signing secrets set — configure all or none"; exit 1; fi
          # The host must BE the target arch (native build, no cross-arch path).
          host=$(uname -m)
          [ "$host" = "$LIPO_ARCH" ] || { echo "::error::runner is $host, target is ${{ matrix.arch }}"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: 'pnpm'

      # Root postinstall = apply-pty-napi-prebuilds.js + electron-builder
      # install-app-deps. On a native runner pnpm materializes exactly the
      # host-arch optional packages (claude-agent-sdk-darwin-<arch>,
      # codex-darwin-<arch>), which is what configure-build.js's
      # required-binaries check demands for this arch.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:frontend → build:main → electron:rebuild → inject-build-info →
      # configure-build (signing posture, lean per-arch packaging plan) →
      # electron-builder --<arch> → afterSign (packaging verifier). With the
      # secrets present electron-builder signs, notarizes via notarytool, and
      # staples; each build logs `notarization successful`.
      - name: Build DMG
        run: pnpm run build:mac:${{ env.MAC_VARIANT == 'dev' && 'dev:' || '' }}${{ matrix.arch }}
        env:
          CI: true
        timeout-minutes: 45

      # The runbook's §4 checks, as assertions. Inventory, not size, proves no
      # foreign-arch agent binary shipped; the size floor only catches the stub.
      - name: Verify artifacts
        run: |
          set -euo pipefail
          cd dist-electron
          APP="$STAGING/$APP_NAME.app"
          test -d "$APP" || { echo "::error::$APP missing"; ls -la; exit 1; }
          ls -lh *.dmg *.zip *.blockmap *.yml

          echo "--- arch"
          lipo -archs "$APP/Contents/MacOS/$APP_NAME" | tee /dev/stderr | grep -qx "$LIPO_ARCH"
          echo "--- agent binaries (must be this arch only)"
          find "$APP" \( -path '*@openai/codex-darwin-*' -o -path '*claude-agent-sdk-darwin-*' \) -type d -prune | tee /dev/stderr \
            | grep -v -- '-darwin-${{ matrix.arch }}' && { echo "::error::foreign-arch agent binary in bundle"; exit 1; } || true

          echo "--- size floor (a 215K DMG is the native-arch stub)"
          for dmg in *.dmg; do
            bytes=$(stat -f %z "$dmg"); [ "$bytes" -gt 100000000 ] || { echo "::error::$dmg is only $bytes bytes"; exit 1; }
          done

          echo "--- bundled peekaboo"
          PB="$APP/Contents/Resources/app.asar.unpacked/node_modules/@steipete/peekaboo-mcp/peekaboo"
          if [ -x "$PB" ]; then "$PB" permissions --json-output | head -c 300; echo; else echo "::warning::peekaboo not bundled (falls back to PATH)"; fi

          if [ "$SIGNED" = 1 ]; then
            echo "--- signature / notarization"
            codesign --verify --deep --strict --verbose=2 "$APP"
            xcrun stapler validate "$APP"
            spctl -a -vvv -t exec "$APP" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
            [ -x "$PB" ] && codesign -dv --verbose=2 "$PB" 2>&1 | grep -E 'TeamIdentifier|flags'
          else
            echo "--- unsigned build: skipping notarization checks"
          fi

      # Per-arch latest-mac.yml: electron-builder writes one per build, each
      # naming only its own arch's files. Publishing merges them (the runbook's
      # gen step) — that is the publish job's concern, not this one's.
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: cyboflow-macos-${{ matrix.arch }}-dmg${{ env.MAC_VARIANT == 'dev' && '-dev' || '' }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
